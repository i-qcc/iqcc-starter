# Questions are asked in this order; `environment` comes first because the
# backend/hardware questions only apply to Learn. A workstation checkout holds
# one qualibrate project per backend (install.py manages the set) and records
# no backend; it renders only the hardware layers its backends need
# (`hardware_layers`, which iqcc_setup.py derives from the chosen backends).
environment:
  type: str
  help: "Target environment. 'learn' = IQCC Learn JupyterLab (preinstalled stack, no install.py / env-var bootstrap)."
  choices:
    - workstation
    - learn
  default: workstation

backend:
  type: str
  when: "{{ environment == 'learn' }}"
  help: "Customer/backend identifier. Used as the QUAM project name, state path, and IQCC cloud backend name."
  choices:
    - gilboa
    - arbel
    - lucy
    - qolab
    - meiron


hardware:
  type: str
  when: "{{ environment == 'learn' }}"
  help: "QPU hardware architecture."
  choices:
    "Fixed-frequency transmons": fixed_freq
    "Flux-tunable transmons, fixed couplers": tunable_transmon
    "Flux-tunable transmons and tunable couplers": tunable_coupler

hardware_layers:
  type: str
  when: "{{ environment != 'learn' }}"
  help: "Comma-separated hardware layers to render: fixed_freq, tunable_transmon, tunable_coupler (tunable_coupler includes tunable_transmon). iqcc_setup.py derives this from the chosen backends."
  default: "fixed_freq,tunable_transmon,tunable_coupler"
  validator: >-
    {% for layer in hardware_layers.split(',') %}{% if layer not in ['fixed_freq', 'tunable_transmon', 'tunable_coupler'] %}Unknown hardware layer '{{ layer }}'. {% endif %}{% endfor %}

os:
  type: str
  help: "Developer OS, used to pick the correct .vscode/settings.json values."
  choices:
    - unix
    - windows

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "CLAUDE.md"
  - "CHANGELOG.md"
  - "iqcc_setup.py"
  - "iqcc_learn_setup.py"
  - ".github"
  - "qua_libs_map.toml"
  - "qua_libs_map.lock.json"
  - ".claude"
  - ".cursor"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Hardware staging folders: Learn (single backend) keeps just its hardware's; a workstation keeps the
  # layers in `hardware_layers`. tunable_coupler inherits tunable_transmon. `copier update` also renders
  # these patterns against an old checkout's answers (no `hardware_layers`, a single `hardware`), hence the default.
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware != 'fixed_freq') or (environment != 'learn' and 'fixed_freq' not in layers) %}calibrations/fixed_freq{% endif %}"
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware not in ['tunable_transmon', 'tunable_coupler']) or (environment != 'learn' and 'tunable_transmon' not in layers and 'tunable_coupler' not in layers) %}calibrations/tunable_transmon{% endif %}"
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware != 'tunable_coupler') or (environment != 'learn' and 'tunable_coupler' not in layers) %}calibrations/tunable_coupler{% endif %}"
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware != 'fixed_freq') or (environment != 'learn' and 'fixed_freq' not in layers) %}calibration_utils/fixed_freq{% endif %}"
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware not in ['tunable_transmon', 'tunable_coupler']) or (environment != 'learn' and 'tunable_transmon' not in layers and 'tunable_coupler' not in layers) %}calibration_utils/tunable_transmon{% endif %}"
  - "{% set layers = (hardware_layers | default(hardware | default('fixed_freq,tunable_transmon,tunable_coupler'))).split(',') %}{% if (environment == 'learn' and hardware != 'tunable_coupler') or (environment != 'learn' and 'tunable_coupler' not in layers) %}calibration_utils/tunable_coupler{% endif %}"
  - "{% if environment == 'learn' %}install.py{% endif %}"
  - "{% if environment == 'learn' %}_build_assets{% endif %}"
  - "{% if environment == 'learn' %}user_scripts{% endif %}"
  - "{% if environment == 'learn' %}.vscode{% endif %}"
  - "{% if environment != 'learn' %}learn_setup.py{% endif %}"

_tasks:
  - command:
      - "{{ _copier_python }}"
      - "-c"
      - |
        import shutil
        from pathlib import Path
        # Base layers first, tunable_coupler last (it extends tunable_transmon). Only the folders
        # that survived _exclude exist (those in `hardware_layers` on a workstation).
        # Items from different layers must not collide.
        for root in ("calibrations", "calibration_utils"):
            seen = set()
            for layer in ("fixed_freq", "tunable_transmon", "tunable_coupler"):
                src = Path(root) / layer
                if not src.is_dir():
                    continue
                for item in src.iterdir():
                    if item.name == ".gitkeep":
                        continue
                    if item.name in seen:
                        raise SystemExit(f"hardware layers collide on {root}/{item.name}")
                    seen.add(item.name)
                    dst = Path(root) / item.name
                    if dst.is_dir():
                        shutil.rmtree(dst)
                    elif dst.exists():
                        dst.unlink()
                    shutil.move(str(item), str(dst))
                shutil.rmtree(src)
  # learn only: the package isn't installed there, so `config` can't be imported.
  # Point every node at quam_builder directly and load state from a path anchored on the node file
  # (independent of the cwd).
  - when: "{{ environment == 'learn' }}"
    command:
      - "{{ _copier_python }}"
      - "-c"
      - |
        from pathlib import Path
        old_import = "from config.quam_builder import Quam"
        new_import = "from pathlib import Path\nfrom quam_builder.architecture.superconducting.qpu import {{ 'FixedFrequencyQuam' if hardware == 'fixed_freq' else 'FluxTunableQuam' }} as Quam"
        new_load = 'Quam.load(str(Path(__file__).resolve().parent.parent / "config" / "quam-state" / "{{ backend }}"))'
        for path in Path("calibrations").glob("*.py"):
            text = path.read_text()
            if old_import not in text and "Quam.load" not in text:
                continue  # node doesn't use Quam (e.g. graph scripts)
            new = text.replace(old_import, new_import).replace("Quam.load()", new_load)
            if "config.quam_builder" in new or new.count("Quam.load(") != new.count(new_load):
                raise SystemExit(f"learn rewrite failed for {path}: expected '{old_import}' and 'Quam.load()'")
            path.write_text(new)
